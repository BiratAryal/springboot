stages:
  - build
  - package
  - helmpackaging
  - helmdeploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/springboot-service"
  IMAGE_TAG: "$CI_PIPELINE_IID"
  CHART: springapp
  HELMURL: "${CI_PROJECT_NAME} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable"

